      - name: Instalar dependencias
        run: |
          pip install pytest
          pip install pytest-cov

      - name: Ejecutar pruebas
        run: |
          pytest

      - name: Ejecutar cobertura
        run: |
          pytest --cov=. --cov-report=xml

      - name: Guardar reporte
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml