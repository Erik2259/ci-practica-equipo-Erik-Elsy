name: CI Pipeline

# Flujo: Push -> Build -> Análisis estático -> Pruebas -> Reporte -> Aprobación
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build (instalar dependencias)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Análisis estático (flake8)
        run: flake8 .

      - name: Pruebas y cobertura
        run: |
          pytest --cov=calculadora --cov=estadisticas \
            --cov-report=term-missing --cov-report=xml --cov-report=html \
            --cov-fail-under=90

      - name: Resumen de métricas
        if: always()
        run: |
          echo "## Reporte de ejecución CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
